name: Plan A isolated validation
on:
  push:
    branches: [feat/personal-dictation]
    paths: ['.github/plan-a-staging/**', '.github/workflows/plan-a-staging.yml']
permissions:
  contents: write
concurrency:
  group: plan-a-personal-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'you3fen/type4me' && github.ref == 'refs/heads/feat/personal-dictation'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      TYPE4ME_PERSONAL_BUILD: '1'
      TYPE4ME_DEV_BUILD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            Type4Me
            Type4MeTests
            Type4MeUI
            Type4MeIntelliSenseCore
            Type4MeReviseCore
            scripts
            docs
            .github
      - name: Verify exact base and patch, prepare candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 5273afdee55260c65816a60b3086cc287f795f4d HEAD -- Type4Me Type4MeTests Type4MeIntelliSenseCore docs
          mkdir -p ci-artifacts
          python3 - <<'PY'
          import gzip, hashlib, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/plan-a-staging').glob('patch-*.bin'))
          assert len(parts) == 10
          packed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(packed).hexdigest() == 'd52da08dd3ab8ba892013cbc7c2b0c46e83da1d905036b3a308d0ef92f34cb44'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '72caa1d7131645a7e5e33b5459f25e9d3bc23cf2d1561dbc8f0f6628b66adce2'
          path = pathlib.Path('ci-artifacts/plan-a.patch'); path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          overlay = pathlib.Path('.github/plan-a-staging/native-compat.patch')
          assert hashlib.sha256(overlay.read_bytes()).hexdigest() == '7d7492258a5156ffcf6bd2c3e905832b5cd28af9c34245bf9b247684604327eb'
          subprocess.run(['git','apply','--check',str(overlay)],check=True)
          subprocess.run(['git','apply',str(overlay)],check=True)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Type4Me Type4MeTests Type4MeIntelliSenseCore docs
          git commit -m 'fix: converge personal vocabulary confirmation and guarded reuse (Plan A)'
          git rev-parse HEAD > ci-artifacts/candidate-sha.txt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; sw_vers; xcodebuild -version; swift --version; } | tee ci-artifacts/provenance.txt
      - name: Full offline personal Dev tests
        shell: bash
        run: |
          set -euo pipefail
          export CFFIXED_USER_HOME="$RUNNER_TEMP/plan-a-hotkey-probe-home"
          mkdir -p "$CFFIXED_USER_HOME"
          swift test --filter 'HotkeyStateMachineTests/testScenario5_CleanHoldPastDelayStartsAndStopsNormallyOnReduction' 2>&1 | tee ci-artifacts/hotkey-probe-build.log
          for attempt in 1 2 3 4 5; do
            swift test --skip-build --filter 'HotkeyStateMachineTests/testScenario5_CleanHoldPastDelayStartsAndStopsNormallyOnReduction' 2>&1 | tee "ci-artifacts/hotkey-probe-$attempt.log"
          done
          export CFFIXED_USER_HOME="$RUNNER_TEMP/plan-a-personal-dev-home"
          mkdir -p "$CFFIXED_USER_HOME"
          swift test 2>&1 | tee ci-artifacts/personal-dev-tests.log
      - name: Flag-free compatibility tests
        shell: bash
        env:
          TYPE4ME_PERSONAL_BUILD: '0'
          TYPE4ME_DEV_BUILD: '0'
        run: |
          set -euo pipefail
          export CFFIXED_USER_HOME="$RUNNER_TEMP/plan-a-flag-free-home"
          mkdir -p "$CFFIXED_USER_HOME"
          swift test --scratch-path "$RUNNER_TEMP/plan-a-flag-free-build" --filter 'VocabularyPlanA|CorrectionReferenceTests|DataBackupManagerTests|PersonalProvenanceIntegrationTests|SnippetApplicationTests' 2>&1 | tee ci-artifacts/compatibility-tests.log
      - name: Build universal Dev bundle without installation
        shell: bash
        env:
          ARCH: universal
          VARIANT: cloud
          APP_FLAVOR: public
          APP_NAME: Type4Me Dev CI
          APP_BUNDLE_ID: com.type4me.dev
          URL_SCHEME: type4me-dev
          CODESIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          export CFFIXED_USER_HOME="$RUNNER_TEMP/plan-a-package-home"
          mkdir -p "$CFFIXED_USER_HOME"
          export APP_PATH="$PWD/dist/Type4Me Dev CI.app"
          bash scripts/package-app.sh 2>&1 | tee ci-artifacts/package.log
          /usr/libexec/PlistBuddy -c "Add :Type4MeSourceCommit string $(git rev-parse HEAD)" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :Type4MeDataNamespace string Type4Me' "$APP_PATH/Contents/Info.plist"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/Type4Me" | tee ci-artifacts/architectures.txt
          /usr/libexec/PlistBuddy -c Print "$APP_PATH/Contents/Info.plist" > ci-artifacts/Info.plist.txt
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ci-artifacts/compile-only-DO-NOT-INSTALL.zip
          echo 'Ad-hoc compile evidence only. Codex must preserve the installed Dev signing identity; do not install this archive over it.' > ci-artifacts/DO-NOT-INSTALL.txt
      - name: Export source and evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd(); manifest = {}
          with zipfile.ZipFile('ci-artifacts/source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
                  if not raw: continue
                  name = raw.decode(); p = root/name
                  if p.is_file() and not p.is_symlink() and p.stat().st_size < 2000000 and (p.suffix in {'.swift','.md','.json','.sh','.yml','.plist','.entitlements'} or p.name == 'LICENSE'):
                      archive.write(p,name)
                      manifest[name] = hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path('ci-artifacts/source-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-a-evidence-${{ github.sha }}
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Publish only successful candidate to the same personal branch
        if: success()
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'you3fen/type4me'
          test "$GITHUB_REF" = 'refs/heads/feat/personal-dictation'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(cat ci-artifacts/candidate-sha.txt)"
          test -z "$(git status --porcelain --untracked-files=no)"
          auth="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 | tr -d '\n')"
          url='https://github.com/you3fen/type4me.git'
          current="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote "$url" refs/heads/feat/personal-dictation | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push "$url" HEAD:refs/heads/feat/personal-dictation
