name: Personal fork checks

on:
  push:
    branches: [feat/personal-dictation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'you3fen/type4me'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/personal-dictation
          sparse-checkout: |
            Type4Me
            Type4MeTests
            Type4MeUI
            Type4MeIntelliSenseCore
            Type4MeReviseCore
            scripts
            docs
            .github
            .ci
      - name: Apply reviewed source, verify digest, publish only to fork branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'you3fen/type4me'
          if test -d .ci/integration; then
            python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          parts = sorted(pathlib.Path('.ci/integration').glob('*.b64'))
          assert len(parts) == 27, len(parts)
          data = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          expected = '8b2eda82d3cc3b55e3fa8ed03e03fa6a9ba78c53218dd4c56521f3679c229e56'
          assert hashlib.sha256(data).hexdigest() == expected, 'Patch digest mismatch; no application changes allowed'
          pathlib.Path('/tmp/personal-integration.patch').write_bytes(data)
          PY
            git apply --check /tmp/personal-integration.patch
            git apply /tmp/personal-integration.patch
            git rm -r .ci/integration
            git add Package.swift Type4Me Type4MeTests Type4MeIntelliSenseCore docs scripts
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: integrate personal vocabulary learning and isolated preview' -m 'Base: upstream 9d638db9 + PR310 d8c69dd8. Includes PR309 abba8174, reviewed vocabulary boundary changes, app-scoped confirmed spelling references, evidence-aware output validation, isolated data and preview packaging. No user transcripts, dictionaries or credentials included.'
            git push origin HEAD:feat/personal-dictation
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD

  macos-validation:
    needs: integrate
    if: github.repository == 'you3fen/type4me'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      TYPE4ME_PERSONAL_BUILD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            Type4Me
            Type4MeTests
            Type4MeUI
            Type4MeIntelliSenseCore
            Type4MeReviseCore
            scripts
            docs
            .github
      - name: Record toolchain and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          { git rev-parse HEAD; sw_vers; xcodebuild -version; swift --version; } | tee ci-artifacts/provenance.txt
          git diff --check
      - name: Build and run offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          export CFFIXED_USER_HOME="$RUNNER_TEMP/type4me-personal-test-home"
          mkdir -p "$CFFIXED_USER_HOME"
          swift test --filter 'Correction|UserEdit|Immediate|IntelliSense|PersonalVocabulary|Vocabulary|LLMPricing|LLMUsage|InjectedText|TextInjection' 2>&1 | tee ci-artifacts/tests.log
      - name: Package universal isolated preview without installation
        shell: bash
        env:
          ARCH: universal
          APP_BUILD: ${{ github.run_number }}
          CODESIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          bash scripts/package-personal.sh 2>&1 | tee ci-artifacts/package.log
          cp dist/Type4Me-Personal-universal.zip ci-artifacts/
          shasum -a 256 ci-artifacts/Type4Me-Personal-universal.zip | tee ci-artifacts/SHA256SUMS
          /usr/libexec/PlistBuddy -c Print 'dist/Type4Me Personal.app/Contents/Info.plist' > ci-artifacts/Info.plist.txt
      - name: Export public source snapshot
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('ci-artifacts/source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
                  if not raw: continue
                  name = raw.decode(); path = root / name
                  if path.is_file() and not path.is_symlink() and path.stat().st_size < 2000000 and (path.suffix in {'.swift','.md','.json','.sh','.yml','.plist','.entitlements'} or path.name == 'LICENSE'):
                      archive.write(path, name)
          PY
      - name: Upload preview and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: personal-preview-${{ needs.integrate.outputs.commit }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
