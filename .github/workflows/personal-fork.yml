name: Personal fork checks

on:
  push:
    branches: [feat/personal-dictation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-validation:
    if: github.repository == 'you3fen/type4me'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      TYPE4ME_PERSONAL_BUILD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Type4Me
            Type4MeTests
            Type4MeUI
            Type4MeIntelliSenseCore
            Type4MeReviseCore
            scripts
            docs
            .github
      - name: Record toolchain and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          { git rev-parse HEAD; sw_vers; xcodebuild -version; swift --version; } | tee ci-artifacts/provenance.txt
          git diff --check
      - name: Build and run full offline test suite
        shell: bash
        run: |
          set -euo pipefail
          export CFFIXED_USER_HOME="$RUNNER_TEMP/type4me-personal-test-home"
          mkdir -p "$CFFIXED_USER_HOME"
          swift test 2>&1 | tee ci-artifacts/tests.log
      - name: Package universal isolated preview without installation
        shell: bash
        env:
          ARCH: universal
          APP_BUILD: ${{ github.run_number }}
          CODESIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          bash scripts/package-personal.sh 2>&1 | tee ci-artifacts/package.log
          cp dist/Type4Me-Personal-universal.zip ci-artifacts/
          shasum -a 256 ci-artifacts/Type4Me-Personal-universal.zip | tee ci-artifacts/SHA256SUMS
          /usr/libexec/PlistBuddy -c Print 'dist/Type4Me Personal.app/Contents/Info.plist' > ci-artifacts/Info.plist.txt
          lipo -info 'dist/Type4Me Personal.app/Contents/MacOS/Type4Me' | tee ci-artifacts/architectures.txt
      - name: Export public source snapshot
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('ci-artifacts/source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
                  if not raw: continue
                  name = raw.decode(); path = root / name
                  if path.is_file() and not path.is_symlink() and path.stat().st_size < 2000000 and (path.suffix in {'.swift','.md','.json','.sh','.yml','.plist','.entitlements'} or path.name == 'LICENSE'):
                      archive.write(path, name)
          PY
      - name: Upload preview and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: personal-preview-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
