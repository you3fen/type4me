name: Archive old branches once
"on":
  push:
    branches: [maintenance/branch-cleanup-20260916]
    paths: [.github/workflows/archive-old-branches-once.yml]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: branch-cleanup-20260916
  cancel-in-progress: false
jobs:
  archive-and-clean:
    if: github.repository == 'you3fen/type4me' && github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Archive exact heads and atomically remove only reviewed old branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          
          REPO = 'you3fen/type4me'
          UPSTREAM = 'joewongjc/type4me'
          MAINTENANCE = 'maintenance/branch-cleanup-20260916'
          UPSTREAM_SHA = '14bd28bd9ef4d65511e53a745ff33fe3086a0c32'
          OLD_MAIN = '1a19e246e35ed3ab61787b26a6cc9b202e01bed8'
          PREFIX = 'archive/2026-09-16/'
          TARGETS = {
              'feat/266-configurable-injection-target': '96054548c9330456de85eab4aad1300038447620',
              'fix/floating-panel-hit-area': '1bbf0de61c0c9d12b999234cb84219db5996ca68',
              'release/2.1.1': 'bbf5dcd5d218930c33b7ca79a5b06051bbbd9e1f',
              'feat/appearance-settings-enhancements': 'acbc41d809950c36f4ede8b1cb5eae87ee5cd547',
              'feat/refine-recording-display': '18ce2475c75bfd3d6e3e450bcb8ba2214d21e9cf',
          }
          PRESERVE = ['feat/personal-dictation', 'fix/308-intellisense-target-context', 'fix/308-review-context-provenance']
          TOKEN = os.environ['GH_TOKEN']
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + MAINTENANCE
          SELF_SHA = os.environ['GITHUB_SHA']
          
          def api(repo, path, method='GET', data=None, missing_ok=False):
              # Writes are allowed only to this fork's Git-reference endpoints.
              if method != 'GET':
                  assert repo == REPO and path == '/git/refs' and method == 'POST'
              headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'type4me-authorized-branch-cleanup', 'X-GitHub-Api-Version': '2022-11-28'}
              if repo == REPO:
                  headers['Authorization'] = 'Bearer ' + TOKEN
              body = None if data is None else json.dumps(data).encode()
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if missing_ok and exc.code == 404:
                      return None
                  raise RuntimeError(f'{method} {repo}{path}: HTTP {exc.code}') from None
          
          def ref(name, repo=REPO):
              value = api(repo, '/git/ref/' + urllib.parse.quote(name, safe='/'), missing_ok=True)
              if value is None:
                  return None
              assert isinstance(value, dict) and value['ref'] == 'refs/' + name
              assert value['object']['type'] == 'commit', f'Unexpected non-commit ref {name}'
              return value['object']['sha']
          
          def open_prs(repo):
              for page in range(1, 101):
                  rows = api(repo, f'/pulls?state=open&per_page=100&page={page}')
                  for row in rows:
                      yield row
                  if len(rows) < 100:
                      return
              raise RuntimeError('PR pagination limit reached; refuse cleanup')
          
          def ensure_tag(name, sha):
              current = ref('tags/' + name)
              if current is None:
                  api(REPO, '/git/refs', 'POST', {'ref': 'refs/tags/' + name, 'sha': sha})
              assert ref('tags/' + name) == sha, f'Archive mismatch: {name}'
              print('ARCHIVED ' + name + ' ' + sha, flush=True)
          
          # Complete all preflight checks before creating tags or deleting anything.
          assert api(REPO, '')['default_branch'] == 'main'
          assert ref('heads/main') == OLD_MAIN, 'main changed concurrently; stop'
          assert ref('heads/main', UPSTREAM) == UPSTREAM_SHA, 'upstream advanced; recheck before cleanup'
          assert ref('heads/' + MAINTENANCE) == SELF_SHA
          before = {name: ref('heads/' + name) for name in PRESERVE}
          assert all(before.values())
          for name, sha in TARGETS.items():
              assert ref('heads/' + name) == sha, f'Branch changed: {name}'
              branch = api(REPO, '/branches/' + urllib.parse.quote(name, safe=''))
              assert not branch.get('protected', False), f'Protected branch: {name}'
          for number, expected in [(269, TARGETS['feat/266-configurable-injection-target']), (261, TARGETS['fix/floating-panel-hit-area'])]:
              pr = api(UPSTREAM, f'/pulls/{number}')
              assert pr['merged'] is True and pr['head']['sha'] == expected, f'PR {number} is not the archived merged head'
          for repo in [REPO, UPSTREAM]:
              for pr in open_prs(repo):
                  for side in ['head', 'base']:
                      source = pr[side]
                      if (source.get('repo') or {}).get('full_name') == REPO:
                          assert source['ref'] not in TARGETS, f'Branch referenced by open PR {repo}#{pr["number"]}'
          
          archives = {PREFIX + name: sha for name, sha in TARGETS.items()}
          archives[PREFIX + 'main-before-sync'] = OLD_MAIN
          archives[PREFIX + 'maintenance-cleanup'] = SELF_SHA
          for name, sha in archives.items():
              ensure_tag(name, sha)
          
          # Atomic compare-and-delete: if ANY expected branch head changed, delete NONE.
          # No source checkout, no product build, and no credentials are printed or persisted.
          deletions = dict(TARGETS)
          deletions[MAINTENANCE] = SELF_SHA
          for name, sha in deletions.items():
              assert ref('heads/' + name) == sha, f'Branch advanced before deletion: {name}'
          with tempfile.TemporaryDirectory(prefix='refs-only-') as directory:
              subprocess.run(['git', 'init', '--bare', '--quiet', directory], check=True)
              env = os.environ.copy()
              env['GIT_TERMINAL_PROMPT'] = '0'
              env['GIT_CONFIG_COUNT'] = '1'
              env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
              encoded = base64.b64encode(('x-access-token:' + TOKEN).encode()).decode()
              env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + encoded
              command = ['git', '-C', directory, 'push', '--atomic', '--porcelain']
              command += [f'--force-with-lease=refs/heads/{name}:{sha}' for name, sha in deletions.items()]
              command += ['https://github.com/' + REPO + '.git']
              command += [':refs/heads/' + name for name in deletions]
              result = subprocess.run(command, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90)
              # Scrub both known token representations even on command failure.
              output = (result.stdout + result.stderr).replace(TOKEN, '[REDACTED]').replace(encoded, '[REDACTED]')
              print(output, flush=True)
              assert result.returncode == 0, 'Atomic delete failed; do not retry without checking refs'
          for name in deletions:
              assert ref('heads/' + name) is None, f'Unexpected surviving branch: {name}'
          for name, sha in archives.items():
              assert ref('tags/' + name) == sha
          assert ref('heads/main') == OLD_MAIN, 'This workflow must not change main'
          after = {name: ref('heads/' + name) for name in PRESERVE}
          report = {'repository': REPO, 'deleted_old_branches': TARGETS, 'archive_tags': archives, 'temporary_maintenance_branch_removed': True, 'main_unchanged_pending_separate_fast_forward': OLD_MAIN, 'preserved_before': before, 'preserved_after': after, 'writes_to_upstream': False}
          print('CLEANUP_RESULT=' + json.dumps(report, sort_keys=True), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Branch cleanup completed\n\nFive old branches archived and deleted. Personal and both PR309 branches were not targeted. The temporary maintenance branch was also removed. Main synchronization is a separate checked step.\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
